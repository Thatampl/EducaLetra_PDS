<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EducaLetra</title>
    <link rel="icon" href="imagem/logo.png" type="image/png" />


    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f0ece2;
        margin: 0;
        padding: 0;
        background-image: url("imagem/fundoc.png");
      }


      header {
        background-color: #935394;
        color: white;
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
      }

      header h1 {
        margin: 0;
        font-size: 2.3em;
        font-weight: bold;
      }

      .escolha-jogo {
        margin-top: 10px;
        font-size: 1.2em;
      }


      header button {
        background: #7607aa;
        color: white;
        padding: 10px 30px;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        font-weight: bold;
        transition: background-color 0.3s;
        align-self: flex-start;
      }

      header button:hover {
        background: #6a1a93;
      }

      .header-barra-topo {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .acoes-direita {
        display: flex;
        gap: 8px;
        align-items: center;
      }

   
      .baloes {
        display: flex;
        justify-content: center;
        gap: 120px;
        margin-top: 100px;
      }

      .botao-jogo {
        background: #865aac;
        padding: 45px;
        border-radius: 30%;
        color: white;
        font-size: 2em;
        font-weight: bold;
        text-align: center;
        width: 250px;
        height: 250px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        cursor: pointer;
        transition: transform 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
      }

      .botao-jogo:hover {
        transform: scale(1.1);
      }

      @media (max-width: 768px) {
        body {
          background-position: 70%;
          background-size: cover ;
        }
        header h1 {
          font-size: 1.8em;
        }

        header button {
          align-self: center;
          margin-bottom: 10px;
        }

        .baloes {
          flex-direction: column;
          gap: 40px;
          margin-top: 50px;
          align-items: center;
        }

        .botao-jogo {
          width: 40vw;
          height: 40vw;
          font-size: 1.6em;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <div class="header-barra-topo">
        <button onclick="window.location.href = 'index.html'">Voltar</button>
        <div class="acoes-direita">
          <button type="button" class="btn-acao-topo" onclick="abrirPainelDireita('modalMateriais')">Materiais</button>
          <button type="button" class="btn-acao-topo" onclick="abrirPainelDireita('modalNotificacoes')" title="Notificações" aria-label="Notificações">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
              <path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2M8 1.918l-.797.161A4 4 0 0 0 4 6c0 .628-.134 2.197-.459 3.742-.16.767-.376 1.566-.663 2.258h10.244c-.287-.692-.502-1.49-.663-2.258C12.134 8.197 12 6.628 12 6a4 4 0 0 0-3.203-3.92zM14.22 12c.223.447.481.801.78 1H1c.299-.199.557-.553.78-1C2.68 10.2 3 6.88 3 6c0-2.42 1.72-4.44 4.005-4.901a1 1 0 1 1 1.99 0A5 5 0 0 1 13 6c0 .88.32 4.2 1.22 6"/>
            </svg>
          </button>
          <button type="button" class="btn-acao-topo" onclick="abrirPainelDireita('modalPerfil')" title="Perfil" aria-label="Perfil">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
              <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/>
            </svg>
          </button>
        </div>
      </div>
      <h1>EducaLetra</h1>
      <p class="escolha-jogo">Escolha um jogo!</p>
    </header>

    <div class="container">
      <div class="baloes">
        <a class="botao-jogo" href="mapaletra.html">LETRA</a>
        <a class="botao-jogo" href="mapasilaba.html">SÍLABA</a>
      </div>
    </div>

    <script src="painel_lateral.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
