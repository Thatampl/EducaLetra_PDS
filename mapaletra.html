<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Mapa de Fases - EducaLetra</title>
  <link rel="icon" href="imagem/logo.png" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0ece2;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    button {
      background: #7607aa;
      color: white;
      padding: 8px 20px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s;
    }
    button:hover {
      background: #6a1a93;
    }

    header {
      background-color: #935394;
      color: white;
      padding: 20px;
    }

    .fases-container {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
      padding: 40px;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }

    .fase {
      background-color: #ddd;
      padding: 20px;
      border-radius: 12px;
      font-size: 20px;
      cursor: pointer;
      transition: 0.3s;
      position: relative;
    }

    .fase.bloqueada {
      background-color: #ccc;
      color: #888;
      cursor: not-allowed;
    }

    .fase.concluida {
      background-color: purple;
      color: white;
    }

    .fase.atual {
      background-color: gold;
      color: black;
    }

    .fase:hover.concluida {
      background-color: #580a7a;
    }

    .fase:hover.atual {
      background-color: #e6c200;
    }

    .estrela {
      position: absolute;
      top: 8px;
      right: 12px;
      font-size: 18px;
    }

    .modal {
      display: none;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: left;
      width: 100%;
      max-width: 800px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.25);
    }

    .modal-content h2 {
      margin-top: 0;
      font-size: 24px;
      color: #4a148c;
    }

    .modal-content p {
      font-size: 16px;
      margin: 10px 0;
    }

    .dificuldade {
      font-weight: bold;
      font-size: 18px;
      color: #4a148c;
    }

    @media (max-width: 992px) {
      .fases-container { grid-template-columns: repeat(3, 1fr); }
      header h1 { font-size: 28px; }
    }

    @media (max-width: 768px) {
      .fases-container { grid-template-columns: repeat(2, 1fr); padding: 20px; }
      .fase { font-size: 18px; }
      header h1 { font-size: 22px; }
    }

    @media (max-width: 480px) {
      .fases-container { grid-template-columns: 1fr; gap: 15px; }
      .fase { font-size: 18px; padding: 15px; }
      .modal-content { width: 100%; }
    }
  </style>
</head>
<body>

  <header class="d-flex flex-column align-items-start">
    <div class="w-100 d-flex justify-content-between align-items-center mb-2">
      <button onclick="window.location.href='jogos.html'">Voltar</button>
      <div class="d-flex gap-2 align-items-center">
        <button type="button" class="btn-acao-topo" onclick="abrirPainelDireita('modalMateriais')">Materiais</button>
        <button type="button" class="btn-acao-topo" onclick="abrirPainelDireita('modalNotificacoes')" title="Notificações" aria-label="Notificações">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2M8 1.918l-.797.161A4 4 0 0 0 4 6c0 .628-.134 2.197-.459 3.742-.16.767-.376 1.566-.663 2.258h10.244c-.287-.692-.502-1.49-.663-2.258C12.134 8.197 12 6.628 12 6a4 4 0 0 0-3.203-3.92zM14.22 12c.223.447.481.801.78 1H1c.299-.199.557-.553.78-1C2.68 10.2 3 6.88 3 6c0-2.42 1.72-4.44 4.005-4.901a1 1 0 1 1 1.99 0A5 5 0 0 1 13 6c0 .88.32 4.2 1.22 6"/>
          </svg>
        </button>
        <button type="button" class="btn-acao-topo" onclick="abrirPainelDireita('modalPerfil')" title="Perfil" aria-label="Perfil">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="w-100 text-center">
      <h1>Jogo das Letras - EducaLetra</h1>
      <p>Escolha uma fase para jogar</p>
    </div>
  </header>

  <div class="container">
    <div class="fases-container" id="fasesContainer"></div>
  </div>

  <div class="modal" id="confirmModal">
    <div class="modal-content">
      <h2 id="faseTitulo">Fase X</h2>
      <p id="descricao">Você está prestes a jogar a Fase X.</p>
      <p class="dificuldade" id="dificuldade"></p>
      <div class="modal-buttons text-end">
        <button onclick="fecharModal()">Cancelar</button>
        <button id="btnConfirmar">Confirmar</button>
      </div>
    </div>
  </div>

  <script src="painel_lateral.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const totalFases = 10;
    let progressoUsuario = 1;
    let fasesSemErrosUsuario = [];

    function getDificuldade(fase) {
      if (fase <= 4) return "Fácil";
      if (fase <= 7) return "Normal";
      return "Difícil";
    }

    async function carregarProgressoIndividual() {
      try {
        const resp = await fetch("api/dados_usuario.php");
        const data = await resp.json();

        if (data.autenticado && data.usuario.tipo_usuario === "aluno" && data.perfil.progresso_jogos) {
          const infoJogo = data.perfil.progresso_jogos[1];
          progressoUsuario = (infoJogo.max_fase || 0) + 1;
          fasesSemErrosUsuario = infoJogo.sem_erros || [];
        } else if (data.autenticado && data.usuario.tipo_usuario !== "aluno") {
          // Professor ou responsável podem visualizar todas as fases desbloqueadas para demonstração
          progressoUsuario = 10;
        }
      } catch (e) {
        progressoUsuario = 1;
      }
      criarMapaFases();
    }

    function criarMapaFases() {
      const container = document.getElementById("fasesContainer");
      container.innerHTML = "";

      for (let i = 1; i <= totalFases; i++) {
        const fase = document.createElement("div");

        if (i < progressoUsuario) {
          fase.className = "fase concluida";
        } else if (i === progressoUsuario) {
          fase.className = "fase atual";
        } else {
          fase.className = "fase bloqueada";
        }

        fase.textContent = "Fase " + i;

        if (i <= progressoUsuario) {
          fase.onclick = () => abrirModal(i);
        }

        if (i < progressoUsuario && fasesSemErrosUsuario.includes(i)) {
          const estrela = document.createElement("span");
          estrela.className = "estrela";
          estrela.textContent = "⭐";
          fase.appendChild(estrela);
        }

        container.appendChild(fase);
      }
    }

    function abrirModal(fase) {
      document.getElementById("faseTitulo").textContent = "Fase " + fase;
      document.getElementById("descricao").textContent =
        `Você está prestes a jogar a Fase ${fase}.`;
      document.getElementById("dificuldade").textContent =
        "Dificuldade: " + getDificuldade(fase);

      document.getElementById("confirmModal").style.display = "flex";

      const btnConfirmar = document.getElementById("btnConfirmar");
      btnConfirmar.onclick = () => {
        window.location.href = `letra.html?fase=${fase}`;
      };
    }

    function fecharModal() {
      document.getElementById("confirmModal").style.display = "none";
    }

    carregarProgressoIndividual();
  </script>

</body>
</html>
